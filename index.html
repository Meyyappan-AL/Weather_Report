<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>India Weather Data Dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c232d;
    --border: #2a323d;
    --text: #e6edf3;
    --muted: #8b96a5;
    --accent: #4aa3ff;
    --hot: #ff7a59;
    --cold: #5fd0ff;
    --rain: #6c9bff;
    --wind: #5ee0b0;
    --ok: #3fb950;
    --warn: #d29922;
    --err: #f85149;
    --hover: #243040;
    --on-accent: #04121f;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f4f6fa;
    --panel: #ffffff;
    --panel-2: #eef1f6;
    --border: #d5dbe5;
    --text: #1b2330;
    --muted: #5d6877;
    --accent: #1f7ae0;
    --hot: #e0502d;
    --cold: #0b8fc4;
    --rain: #3a6fe0;
    --wind: #14a173;
    --hover: #e3e9f2;
    --on-accent: #ffffff;
    color-scheme: light;
  }
  body { transition: background .2s, color .2s; }
  .theme-toggle {
    position: fixed; right: 18px; bottom: 18px; z-index: 50;
    width: 46px; height: 46px; padding: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    box-shadow: 0 4px 14px rgba(0,0,0,.3); cursor: pointer;
  }
  .theme-toggle:hover { border-color: var(--accent); filter: none; }
  .theme-toggle svg { width: 22px; height: 22px; }
  .theme-toggle .i-sun { display: none; }
  :root[data-theme="light"] .theme-toggle .i-sun { display: block; }
  :root[data-theme="light"] .theme-toggle .i-moon { display: none; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 1.5rem; letter-spacing: .2px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: .85rem; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .controls { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; margin-bottom: 16px; }
  @media (max-width: 720px) { .controls { grid-template-columns: 1fr; } }

  .search { position: relative; }
  .row { display: flex; gap: 8px; }
  input[type="text"], select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font-size: .95rem; outline: none;
  }
  input[type="text"] { flex: 1; min-width: 0; }
  input:focus, select:focus { border-color: var(--accent); }
  button {
    background: var(--accent); color: var(--on-accent); border: 0; border-radius: 8px;
    padding: 10px 14px; font-weight: 600; font-size: .9rem; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  label.lbl { display: block; font-size: .75rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .6px; }

  .results {
    position: absolute; z-index: 10; left: 0; right: 0; top: calc(100% + 4px);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    max-height: 260px; overflow-y: auto; display: none;
  }
  .results.open { display: block; }
  .results button {
    display: block; width: 100%; text-align: left; background: transparent; color: var(--text);
    border-radius: 0; font-weight: 400; padding: 10px 12px; border-bottom: 1px solid var(--border);
  }
  .results button:last-child { border-bottom: 0; }
  .results button:hover { background: var(--hover); filter: none; }
  .results small { color: var(--muted); }
  .results .empty { padding: 10px 12px; color: var(--muted); font-size: .9rem; }

  .place { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .place h2 { margin: 0; font-size: 1.2rem; }
  .place .meta { color: var(--muted); font-size: .85rem; }

  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tab {
    background: var(--panel); color: var(--muted); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 999px; font-weight: 500;
  }
  .tab:hover { color: var(--text); filter: none; }
  .tab.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  .tab:disabled { opacity: .4; }

  .datebar { color: var(--muted); font-size: .9rem; margin-bottom: 12px; }
  .datebar strong { color: var(--text); }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  @media (max-width: 800px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .card .k { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .6px; }
  .card .v { font-size: 1.8rem; font-weight: 700; margin-top: 6px; }
  .card .v small { font-size: .9rem; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .c-hot .v { color: var(--hot); } .c-cold .v { color: var(--cold); }
  .c-rain .v { color: var(--rain); } .c-wind .v { color: var(--wind); }

  h3 { margin: 0 0 10px; font-size: 1rem; }
  .strip {
    display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 12px;
    scroll-snap-type: x proximity;
  }
  .strip::-webkit-scrollbar { height: 8px; }
  .strip::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .hour {
    flex: 0 0 84px; scroll-snap-align: start; text-align: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 6px;
  }
  .hour.now { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .hour .t { color: var(--muted); font-size: .78rem; }
  .hour .temp { font-size: 1.15rem; font-weight: 700; margin: 6px 0; }
  .hour .bar { height: 36px; display: flex; align-items: flex-end; justify-content: center; }
  .hour .bar i { display: block; width: 18px; background: var(--rain); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }
  .hour .p { font-size: .75rem; color: var(--rain); margin-top: 4px; }

  .logbox { margin-top: 20px; }
  .logtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .actions { display: flex; gap: 8px; }
  #log {
    background: #0a0e13; border: 1px solid var(--border); border-radius: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .8rem;
    height: 170px; overflow-y: auto; padding: 10px 12px;
  }
  #log div { white-space: pre-wrap; word-break: break-word; }
  #log .ts { color: var(--muted); }
  .st-GEOCODING, .st-FETCHING, .st-PARSING { color: var(--warn); }
  .st-SUCCESS { color: var(--ok); }
  .st-FAILED { color: var(--err); }
  .st-INFO { color: var(--accent); }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 0; }
  footer { margin-top: 24px; color: var(--muted); font-size: .75rem; text-align: center; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>India <span>Weather</span> Data Dashboard</h1>
    <div class="sub">Open-Meteo · 21-day window (10 past · today · 10 ahead)</div>
  </header>

  <section class="panel controls">
    <div class="search">
      <label class="lbl" for="q">Search Indian city</label>
      <div class="row">
        <input type="text" id="q" placeholder="e.g. Madurai, Thoothukudi, Jaipur" autocomplete="off">
        <button id="searchBtn">Search</button>
      </div>
      <div class="results" id="results"></div>
    </div>
    <div>
      <label class="lbl" for="quick">Quick select</label>
      <select id="quick">
        <option value="">Choose a city…</option>
        <option>Mumbai</option>
        <option>Delhi</option>
        <option>Bengaluru</option>
        <option>Chennai</option>
        <option>Kolkata</option>
      </select>
    </div>
  </section>

  <section id="dash" style="display:none">
    <div class="place">
      <div>
        <h2 id="placeName">—</h2>
        <div class="meta" id="placeMeta"></div>
      </div>
      <button id="exportBtn" disabled>Export JSON</button>
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="datebar" id="dateBar"></div>

    <div class="grid" id="metrics"></div>

    <h3>Hourly prediction (24 h) <span class="sub" style="font-weight:400">· temperature and chance of rain (%)</span></h3>
    <div class="strip" id="strip"></div>
  </section>

  <div class="empty-state panel" id="emptyState">Search for an Indian city or pick one from the quick-select list to load weather data.</div>

  <footer>Data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> · No API key required</footer>
</div>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
  <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

<script>
(() => {
  'use strict';

  const GEO_URL = 'https://geocoding-api.open-meteo.com/v1/search';
  const WX_URL  = 'https://api.open-meteo.com/v1/forecast';

  // Fallback coordinates in case geocoding for a quick-select city fails
  const FALLBACK = {
    Mumbai:    { name: 'Mumbai',    admin1: 'Maharashtra', latitude: 19.0728, longitude: 72.8826 },
    Delhi:     { name: 'Delhi',     admin1: 'Delhi',       latitude: 28.6519, longitude: 77.2315 },
    Bengaluru: { name: 'Bengaluru', admin1: 'Karnataka',   latitude: 12.9719, longitude: 77.5937 },
    Chennai:   { name: 'Chennai',   admin1: 'Tamil Nadu',  latitude: 13.0878, longitude: 80.2785 },
    Kolkata:   { name: 'Kolkata',   admin1: 'West Bengal', latitude: 22.5697, longitude: 88.3697 }
  };

  const TABS = [
    { key: 'past10',   label: '10 Days Ago', offset: -10 },
    { key: 'yesterday',label: 'Yesterday',   offset: -1  },
    { key: 'today',    label: 'Today',       offset: 0   },
    { key: 'tomorrow', label: 'Tomorrow',    offset: 1   },
    { key: 'ahead10',  label: '10 Days Ahead', offset: 10 }
  ];

  const $ = id => document.getElementById(id);
  const els = {
    q: $('q'), searchBtn: $('searchBtn'), results: $('results'), quick: $('quick'),
    dash: $('dash'), empty: $('emptyState'), placeName: $('placeName'), placeMeta: $('placeMeta'),
    tabs: $('tabs'), dateBar: $('dateBar'), metrics: $('metrics'), strip: $('strip'),
    exportBtn: $('exportBtn')
  };

  const state = { place: null, payload: null, todayIdx: 10, activeTab: 'today' };

  /* ---------- Logging ---------- */
  function log(status, msg) {
    // On-screen log removed; messages go to the browser console only.
    console.log(`[${status}] ${msg}`);
  }

  /* ---------- Helpers ---------- */
  async function getJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    return res.json();
  }
  const fmt = (v, d = 1) => (v === null || v === undefined || Number.isNaN(v)) ? '—' : Number(v).toFixed(d);
  function fmtDate(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  function hourLabel(h) {
    const ampm = h < 12 ? 'AM' : 'PM';
    return `${h % 12 === 0 ? 12 : h % 12} ${ampm}`;
  }

  /* ---------- Geocoding ---------- */
  async function geocode(name, count = 8) {
    const url = `${GEO_URL}?name=${encodeURIComponent(name)}&count=${count}&language=en&format=json&countryCode=IN`;
    log('GEOCODING...'.replace('...', ''), `Query "${name}" (countryCode=IN)`);
    const data = await getJSON(url);
    return data.results || [];
  }

  async function runSearch() {
    const name = els.q.value.trim();
    if (name.length < 2) { log('FAILED', 'Enter at least 2 characters to search.'); return; }
    els.results.classList.add('open');
    els.results.innerHTML = '<div class="empty">Searching…</div>';
    try {
      const list = await geocode(name);
      log('SUCCESS', `Geocoding returned ${list.length} match(es).`);
      if (!list.length) { els.results.innerHTML = '<div class="empty">No Indian locations found.</div>'; return; }
      els.results.innerHTML = '';
      list.forEach(r => {
        const b = document.createElement('button');
        b.innerHTML = `${escapeHtml(r.name)} <small>${escapeHtml([r.admin2, r.admin1].filter(Boolean).join(', '))}</small>`;
        b.addEventListener('click', () => {
          els.results.classList.remove('open');
          els.q.value = r.name;
          els.quick.value = '';
          loadWeather(r);
        });
        els.results.appendChild(b);
      });
    } catch (e) {
      log('FAILED', `Geocoding error: ${e.message}`);
      els.results.innerHTML = '<div class="empty">Search failed. See log.</div>';
    }
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  async function quickSelect(city) {
    if (!city) return;
    let place;
    try {
      const list = await geocode(city, 5);
      place = list.find(r => r.name.toLowerCase() === city.toLowerCase()) || list[0];
      if (!place) throw new Error('no results');
      log('SUCCESS', `Resolved ${city} → ${place.latitude.toFixed(3)}, ${place.longitude.toFixed(3)}`);
    } catch (e) {
      log('FAILED', `Geocoding for ${city} failed (${e.message}). Using built-in coordinates.`);
      place = FALLBACK[city];
    }
    els.q.value = '';
    loadWeather(place);
  }

  /* ---------- Weather ingestion ---------- */
  async function loadWeather(place) {
    state.place = place;
    const params = new URLSearchParams({
      latitude: place.latitude,
      longitude: place.longitude,
      daily: 'temperature_2m_max,temperature_2m_min,precipitation_sum,windspeed_10m_max',
      hourly: 'temperature_2m,precipitation_probability',
      past_days: 10,
      forecast_days: 11,
      timezone: 'auto'
    });
    const url = `${WX_URL}?${params.toString()}`;
    log('FETCHING', `Open-Meteo forecast for ${place.name} (past_days=10, forecast_days=11)`);
    setBusy(true);
    try {
      const data = await getJSON(url);
      if (!data.daily || !data.hourly) throw new Error('Unexpected response shape');
      log('PARSING', `daily=${data.daily.time.length} rows, hourly=${data.hourly.time.length} rows`);

      // locate "today" using the location's own timezone date
      const nowStr = new Date().toLocaleDateString('en-CA', { timeZone: data.timezone || 'Asia/Kolkata' });
      let idx = data.daily.time.indexOf(nowStr);
      if (idx < 0) idx = 10; // API guarantees 10 past days before today
      state.todayIdx = idx;

      state.payload = {
        meta: {
          location: {
            name: place.name, admin1: place.admin1 || null, admin2: place.admin2 || null,
            country: 'India', latitude: data.latitude, longitude: data.longitude
          },
          timezone: data.timezone,
          requestUrl: url,
          ingestedAt: new Date().toISOString(),
          todayIndex: idx
        },
        daily_units: data.daily_units,
        daily: data.daily,
        hourly_units: data.hourly_units,
        hourly: data.hourly
      };

      els.exportBtn.disabled = false;
      els.empty.style.display = 'none';
      els.dash.style.display = 'block';
      renderHeader();
      buildTabs();
      selectTab(state.activeTab);
      log('SUCCESS', `Payload ingested for ${place.name}.`);
    } catch (e) {
      log('FAILED', `Weather fetch error: ${e.message}`);
    } finally {
      setBusy(false);
    }
  }

  function setBusy(b) {
    els.searchBtn.disabled = b;
    els.quick.disabled = b;
  }

  /* ---------- Rendering ---------- */
  function renderHeader() {
    const p = state.place, m = state.payload.meta;
    els.placeName.textContent = [p.name, p.admin1].filter(Boolean).join(', ');
    els.placeMeta.textContent = `${m.location.latitude.toFixed(3)}°N, ${m.location.longitude.toFixed(3)}°E · ${m.timezone}`;
  }

  function buildTabs() {
    els.tabs.innerHTML = '';
    TABS.forEach(t => {
      const b = document.createElement('button');
      b.className = 'tab';
      b.dataset.key = t.key;
      b.textContent = t.label;
      b.addEventListener('click', () => selectTab(t.key));
      els.tabs.appendChild(b);
    });
  }

  function selectTab(key) {
    state.activeTab = key;
    [...els.tabs.children].forEach(b => b.classList.toggle('active', b.dataset.key === key));
    const tab = TABS.find(t => t.key === key);
    const dayIdx = state.todayIdx + tab.offset;
    renderDay(dayIdx, tab);
  }

  function renderDay(dayIdx, tab) {
    const { daily, hourly, daily_units } = state.payload;
    if (dayIdx < 0 || dayIdx >= daily.time.length) {
      els.metrics.innerHTML = '<div class="card">No data for this day.</div>';
      els.strip.innerHTML = '';
      return;
    }
    const date = daily.time[dayIdx];
    const kind = tab.offset < 0 ? 'historical' : tab.offset === 0 ? 'current day' : 'forecast';
    els.dateBar.innerHTML = `<strong>${escapeHtml(tab.label)}</strong> · ${fmtDate(date)} · ${kind}`;

    const u = daily_units || {};
    const cards = [
      { cls: 'c-hot',  k: 'Max temperature', v: fmt(daily.temperature_2m_max[dayIdx]), u: u.temperature_2m_max || '°C' },
      { cls: 'c-cold', k: 'Min temperature', v: fmt(daily.temperature_2m_min[dayIdx]), u: u.temperature_2m_min || '°C' },
      { cls: 'c-rain', k: 'Precipitation',   v: fmt(daily.precipitation_sum[dayIdx]),  u: u.precipitation_sum || 'mm' },
      { cls: 'c-wind', k: 'Max wind speed',  v: fmt(daily.windspeed_10m_max[dayIdx]),  u: u.windspeed_10m_max || 'km/h' }
    ];
    els.metrics.innerHTML = cards.map(c =>
      `<div class="card ${c.cls}"><div class="k">${c.k}</div><div class="v">${c.v}<small>${escapeHtml(c.u)}</small></div></div>`
    ).join('');

    // 24 hourly cards
    const start = dayIdx * 24;
    const nowHour = (tab.offset === 0) ? currentHourInTz(state.payload.meta.timezone) : -1;
    els.strip.innerHTML = '';
    for (let h = 0; h < 24; h++) {
      const i = start + h;
      const temp = hourly.temperature_2m[i];
      const prob = hourly.precipitation_probability ? hourly.precipitation_probability[i] : null;
      const card = document.createElement('div');
      card.className = 'hour' + (h === nowHour ? ' now' : '');
      const barH = prob == null ? 2 : Math.max(2, Math.round(prob * 0.36));
      card.innerHTML =
        `<div class="t">${hourLabel(h)}</div>` +
        `<div class="temp">${fmt(temp)}°</div>` +
        `<div class="bar"><i style="height:${barH}px"></i></div>` +
        `<div class="p">${prob == null ? 'n/a' : prob + '%'}</div>`;
      els.strip.appendChild(card);
    }
    els.strip.scrollLeft = nowHour > 2 ? (nowHour - 2) * 94 : 0;
  }

  function currentHourInTz(tz) {
    try {
      return parseInt(new Intl.DateTimeFormat('en-GB', { hour: '2-digit', hour12: false, timeZone: tz }).format(new Date()), 10) % 24;
    } catch { return new Date().getHours(); }
  }

  /* ---------- Export ---------- */
  function exportJSON() {
    if (!state.payload) return;
    const blob = new Blob([JSON.stringify(state.payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    const slug = state.place.name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    a.href = URL.createObjectURL(blob);
    a.download = `weather-${slug}-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    log('SUCCESS', `Exported ${a.download} (${(blob.size / 1024).toFixed(1)} KB).`);
  }

  /* ---------- Events ---------- */
  els.searchBtn.addEventListener('click', runSearch);
  els.q.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
  els.quick.addEventListener('change', () => quickSelect(els.quick.value));
  els.exportBtn.addEventListener('click', exportJSON);
  document.addEventListener('click', e => {
    if (!e.target.closest('.search')) els.results.classList.remove('open');
  });

  /* ---------- Theme toggle ---------- */
  const root = document.documentElement;
  function applyTheme(t) { root.setAttribute('data-theme', t); }
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  applyTheme(saved === 'light' ? 'light' : 'dark');
  $('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });

  log('INFO', 'Dashboard ready. Search a city or use quick select.');
})();
</script>
</body>
</html>
